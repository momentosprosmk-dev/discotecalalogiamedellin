<!-- badgenn.html | Badge NN-->

<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="stylesheet" href="../recursos/css/global/base.css">
  <link rel="stylesheet" href="../recursos/css/global/header.css">
  <link rel="stylesheet" href="../recursos/css/servicio/badgenn.css">
</head>
<body>
  <!-- Header | General -->
  <header class="header">
    <div class="logo"><img src="../recursos/media/global/logo_discoteca_la_logia.avif"></div>
    <button id="btn-menu" href="../" class="menu-btn no-active">⌂</button>
  </header>

  <!-- Contenedor principal con fondo -->
  <div class="main-content">
    <!-- Contenedor de QR--> 
    <div class="qr-container">
      <div class="qr-card">
        <p>Carta</p>
        <img src="../recursos/media/global/qr_portal_discoteca_la_logia.avif" alt="QR Carta">
      </div>
      <div class="qr-card">
        <p>WiFi</p>
        <img src="../recursos/media/global/qr_wifi_discoteca_la_logia.avif" alt="QR Wifi">
      </div>
      <div class="qr-card">
        <p>Califica tu noche</p>
        <img src="../recursos/media/global/qr_maps_discoteca_la_logia.avif" alt="QR Comentarios">
      </div>
    </div>
  </div>
</body>
</html>
