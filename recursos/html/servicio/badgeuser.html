<!-- badgeuser.html | Badge User-->
 
<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="stylesheet" href="../recursos/css/servicio/badgeuser.css">
</head>
<body>
 <div class="business-card">
  <!-- Foto -->
  <div class="user-photo">
    <img id="badge_imagenurl" alt="Foto Usuario">
  </div>
    <!-- Información principal -->
    <div class="user-info">
      <h2 id="badge_nombre"></h2>
      <h3 id="badge_cargo"></h3>
    </div>
    <!-- Contenedor de QR -->
    <div class="qr-container" id="qr-container">
      <div class="qr-card small" id="qr-carta" data-type="carta">
        <p id="badge_ppal" class="qr-description"></p>
        <img src="../recursos/media/global/qr_portal_discoteca_la_logia.avif" alt="QR Carta">
        <p  class="qr-titulo">CARTA</p>
      </div>

      <div class="qr-card small" id="qr-wifi" data-type="wifi">
        <p class="qr-description">Conéctate a nuestra red WiFi exclusiva.</p>
        <img src="../recursos/media/global/qr_wifi_discoteca_la_logia.avif" alt="QR Wifi">
        <p  class="qr-titulo">WI-FI</p>
      </div>

      <div class="qr-card small" id="qr-ubicacion" data-type="reseña">
        <p  id="badge_maps" class="qr-description"></p>
        <img src="../recursos/media/global/qr_maps_discoteca_la_logia.avif" alt="QR Ubicación">
        <p  class="qr-titulo">CALIFICA TU NOCHE</p>
      </div>
    </div>
  </div>
</body>
</html>
