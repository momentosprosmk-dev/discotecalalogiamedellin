<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <title>Reservas - La Logia</title>
  <link rel="shortcut icon" href="../../recursos/media/global/favicon_discoteca_la_logia.ico" type="image/x-icon" />
  <link rel="icon" href="../../recursos/media/global/favicon_discoteca_la_logia.ico" type="image/x-icon" />
  <link rel="stylesheet" href="../../recursos/css/global/base.css">
  <link rel="stylesheet" href="../../recursos/css/global/footer.css">
  <link rel="stylesheet" href="../../recursos/css/global/header.css">
  <link rel="stylesheet" href="../../recursos/css/formularios/reservar/base.css">
  <link rel="stylesheet" href="../../recursos/css/formularios/reservar/zona.css">
  <link rel="stylesheet" href="../../recursos/css/formularios/reservar/contacto.css">
  <link rel="stylesheet" href="../../recursos/css/formularios/reservar/botonWhatsApp.css">
  <style>
  html, body {
    background-color: #000000;
    color: #000000;
    margin: 0;
    padding: 0;
  }
  </style>
</head>
<body>
  <!-- Header | General -->
  <header class="header">
    <div class="logo"><img src="../../recursos/media/global/logo_discoteca_la_logia.avif"></div>
    <nav class="nav">
      <ul>
        <li><a href="../../" class="bt-opc">Inicio</a></li>
        <li><a href="../../carta/categorias/" class="bt-opc">Ver carta</a></li>
        <li><a href="../../ubicacion/" class="bt-opc">Ubícanos</a></li>
        <li><a href="https://discotecalalogia.com/" class="bt-opc">Página Web</a></li>
      </ul>
    </nav>
  </header>

  <!-- Formulario de reserva -->
  <section class="menu">
    <div class="menu-inner">
      <form id="reservaForm">

        <!-- Zona seleccionada -->
        <div class="field">
          <label for="zonaSeleccionada">Seleccione zona:</label>
          <select id="zonaSeleccionada" required>
            <option value="">--Seleccione--</option>
            <option value="Palco1">Un Palco - Primer piso</option>
            <option value="Palco1x2">Dos Palcos - Primer piso</option>
            <option value="Palco1x3">Tres Palcos - Primer piso</option>
            <option value="Palco2">Un Palco - Segundo piso</option>
            <option value="Palco2x2">Dos Palcos - Segundo piso</option>
            <option value="Palco2x3">Tres Palcos - Segundo piso</option>
            <option value="VIP">VIP</option>
            <option value="Mesa">Mesa general</option>
          </select>
          <small id="notaZona" class="nota"></small>
        </div>

        <!-- Nombre -->
        <div class="field">
          <label for="nombre">Nombre completo:</label>
          <input type="text" id="nombre" required>
        </div>

        <!-- Contacto -->
        <div class="field">
          <label for="contacto">Teléfono de contacto:</label>
          <div class="telefono-container">
            <!-- Selector de país -->
            <div class="selector-pais">
              <span id="banderaPais" class="bandera"></span>
              <input id="codigoPais" placeholder="Nombre del país" autocomplete="off" required>
            </div>
            <!-- Indicativo oculto -->
            <input type="hidden" id="indicativoPais" name="indicativoPais" required>
            <!-- Número de contacto -->
            <div class="numero-contacto">
              <input type="text" id="contacto" name="contacto" placeholder="Ingrese su número de contacto" required>
            </div>
            <!-- Sugerencias -->
            <div id="sugerencias" class="sugerencias"></div>
          </div>
        </div>

        <!-- Número de personas -->
        <div class="field">
          <label for="personas">Número de personas:</label>
          <input type="number" id="personas" min="1" required>
        </div>

        <!-- Cumpleaños -->
        <div class="field" id="cumpleField">
          <label for="cumple">¿Cumpleaños?:</label>
          <select id="cumple">
            <option value="">--Seleccione--</option>
            <option value="No">No</option>
            <option value="Sí">Sí</option>
          </select>
        </div>

        <!-- Fecha -->
        <div class="field">
          <label for="fecha">Fecha de la reserva:</label>
          <input type="date" id="fecha" required>
        </div>

        <!-- Botón WhatsApp -->
        <div class="whatsapp-btn-container">
          <button type="submit" id="submitBtn" class="inactivo">
            <i class="fa-brands fa-whatsapp"></i>
            Enviar por WhatsApp
          </button>
        </div>

      </form>
    </div>
  </section>


  <!-- Footer | Portal La Logia -->
  <footer>
    <section class="footer-movil">
      <a href="../../" class="btn-footer">⌂ Página Principal</a>
    </section>

    <section  class="footer-pc">
      <div class="footer-container">
        <!-- Logo / Marca -->
        <div class="footer-brand">
          <img src="../../recursos/media/global/footer_discoteca_la_logia.avif" alt="Logo MomentosPro" class="footer-brand-logo">
          <div class="footer-brand-text">
            <p>· La Hermandad Del Perreo ·</p>
          </div>
        </div>
        <!-- Navegación rápida -->
        <nav class="footer-nav">
          <ul>
            <li><a href="../../">Inicio</a></li>
            <li><a href="../../carta/categorias/">Ver carta</a></li>
            <li><a href="../../ubicacion/">Ubícanos</a></li>
            <li><a href="https://discotecalalogia.com/">Página Web</a></li>
          </ul>
        </nav>
        <!-- Redes sociales -->
        <div class="footer-social">
          <a data-link="btn-whatsapp" target="_blank"><i class="fab fa-whatsapp"></i></a>
          <a data-link="btn-facebook" target="_blank"><i class="fab fa-facebook-f"></i></a>
          <a data-link="btn-instagram" target="_blank"><i class="fab fa-instagram"></i></a>
        </div>
      </div>
      <!-- Derechos reservados -->
      <div id="texto-footer" class="footer-copyright"></div>
    </section>
  </footer>

  <!-- Contenedor - Banner de Términos y Condiciones -->
  <div id="tyc-container"></div>

  <!-- Scripts - Recursos -->
  <script>var basePath = "../../";</script>
  <script src="../../recursos/js/global/gateway.js"></script>
  <script src="../../recursos/js/global/copyright.js"></script>
  <script src="../../recursos/js/formularios/gateway.js"></script>

  <!-- Scripts - Banner de Términos y Condiciones -->
  <script src="../../smk/recursos/js/tyc/validadorTyc.js"></script>

  <!-- Scripts - Formularios - Reservar -->
  <script src="../../recursos/js/formularios/reservar/centrarInput.js" defer></script>
  <script src="../../recursos/js/formularios/reservar/zona.js" defer></script>
  <script src="../../recursos/js/formularios/reservar/indicativos.js" defer></script>
  <script src="../../recursos/js/formularios/reservar/numPersonas.js" defer></script>
  <script src="../../recursos/js/formularios/reservar/fecha.js" defer></script>
  <script src="../../recursos/js/formularios/reservar/validarForm.js" defer></script>
  <script src="../../recursos/js/formularios/reservar/submit.js" defer></script>
</body>
</html>
